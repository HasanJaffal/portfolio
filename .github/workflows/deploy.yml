name: deploy

on:
  push:
    branches: [master]
  # So a deploy can be re-run from the Actions tab without an empty commit —
  # useful when a run failed on credentials rather than on the code.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. If two pushes land close together the newer one wins:
# Cloudflare only publishes a version once the upload completes, so a run
# cancelled before that point leaves the live site untouched.
concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed on.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck too.
      # It runs before the deploy step, which is the point: a build that does
      # not compile never reaches Cloudflare.
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
